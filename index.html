<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>COLD BOOT</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* #ui is owned by src/ui — everything DOM-based (HUD, menus, subtitles) lives inside it */
      #ui { position: fixed; inset: 0; pointer-events: none; }
      /* #boot is the pre-JS loading overlay; main.ts updates #boot-status and removes #boot when loading is done */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #7d8a8f;
              font: 12px/1.6 ui-monospace, Menlo, monospace; letter-spacing: 0.3em; text-transform: uppercase; z-index: 100; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot"><div id="boot-status">initialising</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
