<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>COLD BOOT</title>
    <!-- home-screen app (iOS "Add to Home Screen" / Android install): no browser toolbar, landscape -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COLD BOOT" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* #ui is owned by src/ui — everything DOM-based (HUD, menus, subtitles) lives inside it */
      #ui { position: fixed; inset: 0; pointer-events: none; }
      /* #boot is the pre-JS loading overlay; main.ts updates #boot-status and removes #boot when loading is done */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #7d8a8f;
              font: 12px/1.6 ui-monospace, Menlo, monospace; letter-spacing: 0.3em; text-transform: uppercase; z-index: 100;
              transition: opacity .3s ease; }
      #boot.done { opacity: 0; }
      .boot-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      /* src/core/bootbar.ts drives #boot-fill with transform transitions (they keep moving while the page is busy) */
      #boot-bar { width: min(260px, 60vw); height: 1px; background: rgba(125,138,143,.22); overflow: hidden; }
      #boot-fill { height: 100%; background: #74e4ff; box-shadow: 0 0 8px rgba(116,228,255,.7); transform-origin: left;
                   transform: scaleX(0); will-change: transform; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="boot-col"><div id="boot-status">initialising</div><div id="boot-bar"><div id="boot-fill"></div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
