[project]
name = "coldvoice"
version = "0.1.0"
description = "COLD BOOT voice line generator (OmniVoice + Parakeet on MLX; engine pieces copied from tities)"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio==0.6.5",
    "numpy>=2.5.4",
    "scipy>=1.18",
]

[project.scripts]
coldvoice = "coldvoice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldvoice"]
